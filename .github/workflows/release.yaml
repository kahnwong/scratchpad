name: Release
on:
  release:
    types:
      - published
permissions:
  contents: write
jobs:
  flatpak:
    name: Flatpak (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - name: Install Flatpak dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            flatpak \
            flatpak-builder
      - name: Restore Flatpak build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/flatpak
            .flatpak-builder
            target
          key: flatpak-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('io.github.kahnwong.Scratchpad.yaml', 'Cargo.lock') }}
          restore-keys: |
            flatpak-${{ runner.os }}-${{ matrix.arch }}-
      - name: Set up Flatpak remote
        run: flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Build Flatpak bundle
        env:
          VERSION: ${{ github.event.release.tag_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          make bundle
          if [ "$ARCH" = "x86_64" ]; then
            mv scratchpad.flatpak "scratchpad_${VERSION#v}.flatpak"
          else
            mv scratchpad.flatpak "scratchpad_${VERSION#v}_linux-${ARCH}.flatpak"
          fi
      - name: Publish Flatpak bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" scratchpad_*.flatpak --clobber
  deb:
    name: Debian (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - name: Install Debian package dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            meson \
            ninja-build \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgtksourceview-5-dev
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Restore Cargo build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: deb-cargo-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            deb-cargo-${{ runner.os }}-${{ matrix.arch }}-
      - name: Build Debian package
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${VERSION#v}" scripts/build-deb.sh
      - name: Publish Debian package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" scratchpad_*.deb --clobber
