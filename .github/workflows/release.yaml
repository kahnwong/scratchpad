name: Release
on:
  release:
    types:
      - published
permissions:
  contents: write
jobs:
  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Flatpak dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            flatpak \
            flatpak-builder
      - name: Restore Flatpak build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/flatpak
            .flatpak-builder
            target
          key: flatpak-${{ runner.os }}-${{ hashFiles('io.github.kahnwong.Scratchpad.yaml', 'Cargo.lock') }}
          restore-keys: |
            flatpak-${{ runner.os }}-
      - name: Set up Flatpak remote
        run: flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Build Flatpak bundle
        run: make bundle
      - name: Publish Flatpak bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" scratchpad.flatpak --clobber
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Debian package dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            meson \
            ninja-build \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgtksourceview-5-dev
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Restore Cargo build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: deb-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            deb-cargo-${{ runner.os }}-
      - name: Build Debian package
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${VERSION#v}" scripts/build-deb.sh
      - name: Publish Debian package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" scratchpad_*.deb --clobber
