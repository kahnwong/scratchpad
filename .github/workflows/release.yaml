name: Release
on:
  release:
    types:
      - published
permissions:
  contents: write
jobs:
  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Flatpak dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            flatpak \
            flatpak-builder
      - name: Set up Flatpak remote
        run: flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Build Flatpak bundle
        run: make bundle
      - name: Publish Flatpak bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" scratchpad.flatpak --clobber
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Debian package dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            meson \
            ninja-build \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgtksourceview-5-dev
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build Debian package
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${VERSION#v}" scripts/build-deb.sh
      - name: Publish Debian package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" scratchpad_*.deb --clobber
