[package]
name = "scratchpad"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "scratchpad"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_4"]  }
sourceview5 = "0.9"
serde_json = "1"
serde_yaml = "0.9"
